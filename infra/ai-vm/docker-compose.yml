services:
  ollama:
    image: ollama/ollama:latest
    container_name: giftgrid-ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    expose:
      - "11434"
    # The free Oracle Ampere VM is CPU/ARM. Add a GPU runtime only on a GPU host.

  ai-gateway:
    image: nginx:1.27-alpine
    container_name: giftgrid-ai-gateway
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  ollama:
